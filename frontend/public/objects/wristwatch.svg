<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Wristwatch: brown leather strap, silver bezel, white face with hands -->
  <rect x="392" y="128" width="240" height="212" rx="64" fill="#92400e" stroke="#1f2937" stroke-width="12" stroke-linejoin="round"/>
  <rect x="392" y="684" width="240" height="212" rx="64" fill="#92400e" stroke="#1f2937" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="512" cy="470" r="230" fill="#9ca3af" stroke="#1f2937" stroke-width="14"/>
  <circle cx="512" cy="470" r="200" fill="#f8fafc" stroke="#1f2937" stroke-width="12"/>
  <!-- crown -->
  <rect x="736" y="448" width="56" height="44" rx="14" fill="#6b7280" stroke="#1f2937" stroke-width="12"/>
  <rect x="722" y="460" width="18" height="20" rx="6" fill="#4b5563" stroke="#1f2937" stroke-width="8"/>
  <!-- hour ticks -->
  <rect x="502" y="300" width="20" height="44" rx="9" fill="#111827"/>
  <rect x="622" y="460" width="44" height="20" rx="9" fill="#111827"/>
  <rect x="502" y="596" width="20" height="44" rx="9" fill="#111827"/>
  <rect x="358" y="460" width="44" height="20" rx="9" fill="#111827"/>
  <!-- hands -->
  <line x1="512" y1="470" x2="512" y2="316" stroke="#111827" stroke-width="34" stroke-linecap="round" transform="rotate(-55 512 470)"/>
  <line x1="512" y1="470" x2="512" y2="282" stroke="#111827" stroke-width="24" stroke-linecap="round" transform="rotate(25 512 470)"/>
  <line x1="512" y1="470" x2="512" y2="312" stroke="#dc2626" stroke-width="10" stroke-linecap="round" transform="rotate(70 512 470)"/>
  <circle cx="512" cy="470" r="26" fill="#111827" stroke="#1f2937" stroke-width="8"/>
</svg>
